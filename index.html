<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ambassadeur MoBudget - Espace Membre</title><style>*{box-sizing:border-box}body{font-family:'Segoe UI',Arial;margin:0;background:linear-gradient(135deg,#6a0dad 0%,#9b59b6 100%);color:#333;position:relative;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}body::before{content:"";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;background-image:url('logo.png');background-repeat:no-repeat;background-size:contain;opacity:.05;z-index:-1;pointer-events:none}header{background:linear-gradient(90deg,#000,#1a1a1a);color:white;padding:15px 25px;display:flex;align-items:center;gap:15px;box-shadow:0 4px 10px rgba(0,0,0,.3);position:relative;z-index:1;border-bottom:3px solid #FFD700}.logo-header{width:65px;height:65px;border-radius:50%;border:3px solid #FFD700;object-fit:cover;box-shadow:0 0 10px rgba(255,215,0,.5)}header div h1{margin:0;font-size:22px;color:#FFD700}header div p{margin:0;font-size:13px;opacity:.9}.container{max-width:1000px;margin:20px auto;padding:20px;background:white;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.2);position:relative;z-index:1}.menu button{width:32%;margin:.5%}input,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ccc;font-size:15px}button{background:#6a0dad;color:white;border:none;cursor:pointer;font-weight:bold}button:hover{background:#4a148c}.profil{display:flex;align-items:center;gap:20px;border:2px solid #FFD700;padding:15px;border-radius:10px;margin:15px 0;background:#fffde7}.profil img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #6a0dad}.admin{display:none;background:#fffde7;padding:15px;border-radius:8px;margin-top:15px;overflow-x:auto;border:2px solid #FFD700}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{border:1px solid #ddd;padding:10px;text-align:left}th{background:#6a0dad;color:white}.success{background:#d4edda;padding:15px;border-radius:8px;margin:15px 0;border:1px solid #c3e6cb}.btn-whatsapp{background:#25D366}.btn-download{background:#FFD700;color:#000}.prix{font-size:24px;color:#6a0dad;font-weight:bold}.logout{background:#d32f2f}.btn-contact{background:#128C7E}.badge{background:#FFD700;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}</style><script>document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>{e.preventDefault();alert("⚠️ Espace Ambassadeur MoBudget protégé")});document.addEventListener('cut',e=>e.preventDefault());document.onkeydown=function(e){if(e.keyCode==123)return false;if(e.ctrlKey&&e.shiftKey&&e.keyCode==73)return false;if(e.ctrlKey&&e.shiftKey&&e.keyCode==67)return false;if(e.ctrlKey&&e.keyCode==85)return false};</script></head><body><header><img src="logo.png" alt="Logo Ambassadeur MoBudget" class="logo-header"><div><h1>👑 Ambassadeur MoBudget</h1><p>Espace Membre | Gère tes ventes, ton équipe et tes gains <span class="badge">Fait au Bénin 🇧🇯</span></p></div></header><div class="container"><div id="menu" class="menu"><button onclick="show('inscription')">1. Devenir Ambassadeur</button><button onclick="show('connexion')">2. Connexion Membre</button><button onclick="show('adminLogin')">3. Espace Admin</button></div><div id="inscription" class="hidden"><h3>Rejoindre l'équipe Ambassadeur MoBudget</h3><input type="text" id="nom" placeholder="Nom Complet" required><input type="email" id="email" placeholder="Email" required><input type="tel" id="tel" placeholder="Numéro MoMo/Moov: 0190000" required><input type="password" id="pass" placeholder="Mot de passe" required><label><b>Photo de Profil :</b></label><input type="file" id="photo" accept="image/*" required><button onclick="creerCompte()">S’inscrire et Recevoir mon Kit</button><p id="msgInsc"></p></div><div id="zoneCadeau" class="hidden success"><h3>🎁 Bienvenue Ambassadeur!</h3><p>Télécharge ton Kit de démarrage et commence à gagner</p><button class="btn-download" onclick="telechargerExcel()">📥 Télécharger Kit_Ambassadeur.xlsx</button><button class="btn-whatsapp" id="btnWhatsApp">📱 Recevoir sur WhatsApp</button></div><div id="connexion" class="hidden"><h3>Connexion Ambassadeur</h3><input type="email" id="emailConnect" placeholder="Ton Email"><input type="password" id="passConnect" placeholder="Mot de passe"><button onclick="connecterMembre()">Se Connecter</button><div id="profilMembre"></div></div><div id="adminLogin" class="hidden"><h3>Espace Administrateur MoBudget</h3><input type="password" id="passAdmin" placeholder="Mot de passe admin"><button onclick="connecterAdmin()">Entrer</button><div id="panelAdmin" class="admin"></div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,addDoc,getDocs,doc,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";const firebaseConfig={apiKey:"AIzaSyDNDu79b-MElmCdJb1Xm6RXQP7t6B9vmw0",authDomain:"mon-carnet-budget.firebaseapp.com",projectId:"mon-carnet-budget",storageBucket:"mon-carnet-budget.firebasestorage.app",messagingSenderId:"843070929654",appId:"1:843070929654:web:d4ed9e8e0ad7c00a39cad7"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);const storage=getStorage(app);const PASS_ADMIN="admin2026_CHANGE_MOI";const MON_NUMERO_WHATSAPP="2290152749044";let membreConnecte=null;let membreDocId=null;window.show=id=>{['inscription','connexion','adminLogin','zoneCadeau'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')};window.creerCompte=async()=>{const nom=document.getElementById('nom').value;const email=document.getElementById('email').value;const tel=document.getElementById('tel').value;const pass=document.getElementById('pass').value;const file=document.getElementById('photo').files[0];if(!file)return alert("Ajoute une photo de profil");document.getElementById('msgInsc').innerText="Création en cours...";try{const userCredential=await createUserWithEmailAndPassword(auth,email,pass);const user=userCredential.user;const storageRef=ref(storage,'photos/'+user.uid);await uploadBytes(storageRef,file);const photoURL=await getDownloadURL(storageRef);await addDoc(collection(db,"ambassadeurs"),{uid:user.uid,nom,email,tel,photo:photoURL,solde:0,statut:"Actif",niveau:"2000F",date:new Date()});document.getElementById('msgInsc').innerText="";show('zoneCadeau');const lienSite=window.location.href;const message=`Salut ${nom}! 👑 Bienvenue Ambassadeur MoBudget.\n\nTélécharge ton Kit ici: ${lienSite}\n\nCommence à parrainer et gagner.`;document.getElementById('btnWhatsApp').onclick=()=>{window.open(`https://wa.me/229${tel}?text=${encodeURIComponent(message)}`,'_blank')}}catch(error){document.getElementById('msgInsc').innerText="Erreur: "+error.message}};window.connecterMembre=async()=>{const email=document.getElementById('emailConnect').value;const pass=document.getElementById('passConnect').value;try{const userCredential=await signInWithEmailAndPassword(auth,email,pass);const querySnapshot=await getDocs(collection(db,"ambassadeurs"));querySnapshot.forEach(docu=>{if(docu.data().uid==userCredential.user.uid){membreConnecte=docu.data();membreDocId=docu.id;document.getElementById('profilMembre').innerHTML=`<div class="profil"><img src="${membreConnecte.photo}"><div><h4>${membreConnecte.nom} <span class="badge">${membreConnecte.niveau}</span></h4><p>Tel: ${membreConnecte.tel}</p><p class="prix">Gains: ${membreConnecte.solde} FCFA</p><button class="btn-download" onclick="telechargerExcel()">📥 Télécharger mon Kit</button><button class="btn-contact" onclick="contacterAdmin()">📱 Contacter l'Admin</button><button class="logout" onclick="deconnexion()">Se Déconnecter</button></div></div>`}})}catch(error){alert("Email ou mot de passe incorrect")}};window.deconnexion=async()=>{await signOut(auth);document.getElementById('profilMembre').innerHTML="";show('menu')};window.connecterAdmin=async()=>{if(document.getElementById('passAdmin').value==PASS_ADMIN){let html="<h4>Tous les Ambassadeurs - Total Gains: </h4><table><tr><th>Photo</th><th>Nom</th><th>Email</th><th>Tel</th><th>Niveau</th><th>Gains FCFA</th><th>Action</th></tr>";let total=0;const querySnapshot=await getDocs(collection(db,"ambassadeurs"));querySnapshot.forEach(docu=>{let m=docu.data();total+=m.solde;html+=`<tr><td><img src="${m.photo}" width="50"></td><td>${m.nom}</td><td>${m.email}</td><td>${m.tel}</td><td>${m.niveau}</td><td>${m.solde} FCFA</td><td><button onclick="faireDepot('${docu.id}',${m.solde})">+ Commission</button><button class="btn-whatsapp" onclick="window.open('https://wa.me/229${m.tel}','_blank')">WhatsApp</button></td></tr>`});html+=`</table><h3>Total à payer: ${total} FCFA</h3>`;document.getElementById('panelAdmin').innerHTML=html;document.getElementById('panelAdmin').style.display='block'}else{alert("Mauvais mot de passe admin")}};window.faireDepot=async(id,ancienSolde)=>{let montant=prompt("Commission à ajouter en FCFA :");if(montant&&!isNaN(montant)){const docRef=doc(db,"ambassadeurs",id);await updateDoc(docRef,{solde:ancienSolde+parseInt(montant)});alert(montant+" FCFA ajoutés");connecterAdmin()}};window.contacterAdmin=()=>{const message=`Bonjour Admin MoBudget, je suis ${membreConnecte.nom}. Besoin d'aide.`;window.open(`https://wa.me/${MON_NUMERO_WHATSAPP}?text=${encodeURIComponent(message)}`,'_blank')};window.telechargerExcel=()=>{const link=document.createElement('a');link.href='Kit_Ambassadeur_MoBudget.xlsx';link.download='Kit_Ambassadeur_MoBudget.xlsx';link.click()}</script></body></html>
